<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Main Sequence Layout Builder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Main Sequence Layout Builder</h1>
    <div class="station-controls">
      <div class="zoom-controls" aria-label="Canvas zoom">
        <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
        <span id="zoom-level">100%</span>
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button id="zoom-reset" type="button" title="Fit and center the entire layout">Fit layout</button>
      </div>
      <button id="clear" type="button">Clear</button>
    </div>
  </header>

  <main>
    <aside id="palette" class="panel">
      <h2 title="Choose a room and click the star field. Additional rooms must touch at matching openings. Scroll to explore.">Rooms</h2>
      <div id="room-list" class="palette-list">
        <button type="button" class="room-button" data-size="1x1">Station 1×1</button>
        <button type="button" class="room-button" data-size="2x1">Station 2×1 <small>(inferred)</small></button>
        <button type="button" class="room-button" data-size="2x2">Station 2×2 A</button>
        <button type="button" class="room-button" data-size="dock">Dock <small>(inferred)</small></button>
        <button type="button" class="room-button" data-size="control-center">Control Center <small>(inferred)</small></button>
      </div>
      <h2 title="Select a machine, then click a usable tile. Drag placed machines to move them.">Machines</h2>
      <div id="machine-list" class="palette-list"></div>
      <h2 title="At 200% zoom, belt arrows become rates in items/min. Grey is below target, green equal, red over capacity; amber or ? means unknown. Machine inputs are capped at recipe demand.">Belts</h2>
      <button id="belt" type="button" aria-pressed="false" title="Drag, or click to start and click to end. Start on/beside an endpoint to extend; end into another belt to merge. Click the same tile twice for one tile. Hover and press R to turn a tile or X to remove it. No crossings. Escape cancels. Belt rules are provisional.">Draw belt</button>
      <h2 title="Click a port to turn it on (green) or off (red); triangles point out for outputs and in for inputs. Splitters share flow evenly among connected outputs, capped at demand, and redirect overflow to outputs with remaining demand. Rotate to turn the port roles.">Belt machines</h2>
      <div id="belt-machine-list" class="palette-list"></div>
      <button id="select" type="button">Select / move</button>
      <button id="rotate" type="button">Rotate selected (R)</button>
      <button id="delete" type="button">Delete selected</button>
    </aside>

    <section class="workspace panel">
      <div class="canvas-wrap">
        <div class="layout-stage">
          <canvas id="layout-canvas" aria-label="Station layout canvas"></canvas>
          <svg id="layout-symbols" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1536" aria-hidden="true"></svg>
        </div>
      </div>
      <div id="status" role="status">Loading data…</div>
    </section>

    <aside class="panel details">
      <h2>Selection</h2>
      <div id="selection-details">Nothing selected</div>
      <div id="recipe-control" hidden>
        <label for="recipe-select">Assigned recipe</label>
        <select id="recipe-select"></select>
      </div>
      <h2>Power</h2>
      <div id="power-total">0 MW</div>
      <h2>Recipes</h2>
      <div id="recipe-list">Place a machine to view recipes.</div>
      <h2>Project</h2>
      <div class="actions">
        <button id="save" type="button">Save</button>
        <button id="load" type="button">Load</button>
        <button id="export" type="button">Export JSON</button>
        <button id="import" type="button">Import JSON</button>
        <button id="share" type="button">Copy share link</button>
      </div>
      <input id="import-file" type="file" accept="application/json" hidden>
    </aside>
  </main>

  <dialog id="export-dialog" aria-labelledby="export-title">
    <form id="export-form">
      <h2 id="export-title">Export layout</h2>
      <label for="export-filename">Filename</label>
      <input id="export-filename" type="text" value="main-sequence-layout.json" required autofocus>
      <p class="hint">The .json extension is added automatically if needed.</p>
      <div class="actions">
        <button id="export-cancel" type="button">Cancel</button>
        <button type="submit">Download JSON</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
